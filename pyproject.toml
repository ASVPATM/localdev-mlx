[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localdev-mlx"
version = "0.1.3"
description = "A lightweight Git workflow for planning, coding, testing, and reviewing with local MLX models."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Abeil Melles" }]
keywords = ["mlx", "local-llm", "coding-agent", "git", "apple-silicon"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
  "httpx>=0.27,<1",
  "platformdirs>=4,<5",
  "pydantic>=2.8,<3",
  "rich>=13.7,<16",
  "typer>=0.12,<1",
]

[project.scripts]
localdev-mlx = "localdev_mlx.cli:app"

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
