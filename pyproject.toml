[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localdev-mlx"
dynamic = ["version"]
description = "Preview apps, capture issues, and export coding handoffs. Local MLX models are optional."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Abeil Melles" }]
keywords = ["mlx", "local-llm", "coding-agent", "git", "apple-silicon"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
  "httpx>=0.27,<1",
  "platformdirs>=4,<5",
  "pydantic>=2.8,<3",
  "rich>=13.7,<16",
  "typer>=0.12,<1",
]

[project.scripts]
localdev-mlx = "localdev_mlx.cli:app"

[project.optional-dependencies]
flow-browser = ["playwright>=1.49,<2", "Pillow>=11,<13"]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"localdev_mlx.flow" = ["*.html", "*.css", "*.js", "LICENSE", "VENDORED_SOURCE.json", "examples/web/*.toml", "examples/web/src/*.py", "examples/web/src/*.html", "examples/web/src/*.css", "examples/web/src/*.js", "examples/manual/*.toml"]

[tool.setuptools.exclude-package-data]
"*" = ["*.pyc", "__pycache__/*"]

[tool.setuptools.dynamic]
version = {attr = "localdev_mlx.__version__"}

[tool.uv]
cache-keys = [{file = "pyproject.toml"}, {file = "src/localdev_mlx/__init__.py"}]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
